<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; }
        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .drawing-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .drawing-card img {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: black;
        }
        .drawing-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            font-size: 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: none;
        }
        .admin-mode .delete-btn { display: inline-block; }
        #loading {
            margin-top: 50px;
            font-size: 18px;
            color: #666;
        }
        #error-log {
            color: red;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        #admin-info {
            display: none;
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>社区画廊 / Community Gallery</h1>
    <div id="admin-info">管理员模式已激活 / ADMIN MODE ACTIVE</div>
    <a href="index.html" class="back-link">← 返回画板 / Back to Drawing Board</a>

    <div id="loading">正在加载作品... / Loading artworks...</div>
    <div id="error-log"></div>
    <div id="gallery" class="gallery-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getFirestore, collection, query, orderBy, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAXoCirYLEY-hR-5NGzwFGas7FYN_6g4e8",
            authDomain: "ojbkdrawingtool.firebaseapp.com",
            projectId: "ojbkdrawingtool",
            storageBucket: "ojbkdrawingtool.firebasestorage.app",
            messagingSenderId: "629287348964",
            appId: "1:629287348964:web:97e9c481c0b26a0eecdaf1",
            measurementId: "G-XR62TPE8EK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 管理员模式
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === '1234'; 
        if (isAdmin) {
            document.body.classList.add('admin-mode');
            document.getElementById('admin-info').style.display = 'block';
        }

        async function loadGallery() {
            const galleryElement = document.getElementById('gallery');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error-log');
            
            try {
                const q = query(collection(db, "drawings"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                loadingElement.style.display = 'none';
                
                if (querySnapshot.empty) {
                    loadingElement.innerText = "暂无作品。快去分享第一幅吧！\nNo drawings found. Be the first to share!";
                    loadingElement.style.display = 'block';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const docId = docSnap.id;
                    const date = data.createdAt ? data.createdAt.toDate().toLocaleString() : "最近分享 / Recently shared";
                    
                    if (!isAdmin && data.status && data.status !== 'active') return;

                    const card = document.createElement('div');
                    card.className = 'drawing-card';
                    card.innerHTML = `
                        <img src="${data.imageData}" alt="Drawing">
                        <div class="drawing-info">
                            <span>分享于 / Shared on: ${date}</span>
                            <button class="delete-btn" onclick="window.deleteDrawing('${docId}')">删除 / Delete</button>
                        </div>
                    `;
                    galleryElement.appendChild(card);
                });
            } catch (error) {
                console.error("Gallery Error:", error);
                loadingElement.innerText = "加载失败。 / Failed to load.";
                errorElement.innerText = "错误详情 / Error: " + error.message;
                errorElement.style.display = 'block';
            }
        }

        window.deleteDrawing = async (docId) => {
            if (confirm("管理员操作：永久删除此画作？\nADMIN: Permanent delete?")) {
                try {
                    await deleteDoc(doc(db, "drawings", docId));
                    location.reload();
                } catch (e) { alert("删除失败 / Delete failed: " + e.message); }
            }
        };

        loadGallery();
    </script>
</body>
</html>
