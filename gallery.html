<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drawing Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; }
        .back-link {
            margin-bottom: 20px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1200px;
            padding: 10px;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            .gallery-container {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 10px;
                padding: 5px;
            }
            .drawing-card {
                padding: 5px;
            }
            .drawing-info {
                font-size: 10px;
            }
        }
        .drawing-card {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .drawing-card img {
            width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: black;
        }
        .drawing-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            padding: 5px 10px;
            font-size: 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            display: none;
        }
        .admin-mode .delete-btn { display: inline-block; }
        
        /* 点赞功能样式 */
        .like-container {
            position: absolute;
            right: 15px;
            bottom: 60px; /* 位于图片右下角 */
            background: rgba(255, 255, 255, 0.85);
            padding: 5px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0; /* 平时隐藏 */
            transform: translateY(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            user-select: none;
            z-index: 10;
        }
        
        .drawing-card:hover .like-container {
            opacity: 1; /* 鼠标滑过时显示 */
            transform: translateY(0);
        }
        
        .like-icon {
            font-size: 18px;
            color: #ff4757;
            transition: transform 0.2s;
        }
        
        .like-container:active .like-icon {
            transform: scale(1.3);
        }
        
        /* 已点赞状态 */
        .like-container.liked {
            background: rgba(255, 71, 87, 0.15);
            cursor: default;
        }
        
        .like-container.liked .like-icon {
            color: #ff4757;
            text-shadow: 0 0 5px rgba(255, 71, 87, 0.3);
        }
        
        .like-container.liked .like-count {
            color: #ff4757;
        }

        #loading {
            margin-top: 50px;
            font-size: 18px;
            color: #666;
        }
        #error-log {
            color: red;
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        #admin-info {
            display: none;
            background: #333;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .watermark {
            margin-top: 40px;
            text-align: center;
            color: #666;
            opacity: 0.5;
            font-size: 14px;
            line-height: 1.2;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .watermark p {
            margin: 3px 0;
            width: 100%;
        }
        @media (max-width: 600px) {
            .watermark {
                margin-top: 20px;
                font-size: 11px;
                opacity: 0.4;
            }
            .watermark p {
                margin: 1px 0;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <h1>社区画廊 / Community Gallery</h1>
    <div id="admin-info">管理员模式已激活 / ADMIN MODE ACTIVE</div>
    <a href="index.html" class="back-link">← 返回画板 / Back to Drawing Board</a>

    <div id="loading">正在加载作品... / Loading artworks...</div>
    <div id="error-log"></div>
    <div id="gallery" class="gallery-container"></div>

    <!-- 使用更稳定的 jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.js"></script>

    <!-- 我们的 Supabase 客户端配置 -->
    <script src="supabase-client.js"></script>

    <script>
        // 管理员模式检查
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === '1234'; 
        if (isAdmin) {
            document.body.classList.add('admin-mode');
            document.getElementById('admin-info').style.display = 'block';
        }

        async function loadGallery() {
            const galleryElement = document.getElementById('gallery');
            const loadingElement = document.getElementById('loading');
            const errorElement = document.getElementById('error-log');
            
            // 获取已点赞列表
            const likedDrawings = JSON.parse(localStorage.getItem('likedDrawings') || '[]');
            
            try {
                // 从 MemFire 读取数据，按时间倒序
                const { data, error } = await window.supabaseClient
                    .from('drawings')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                loadingElement.style.display = 'none';
                
                if (!data || data.length === 0) {
                    loadingElement.innerText = "暂无作品。快去分享第一幅吧！\nNo drawings found. Be the first to share!";
                    loadingElement.style.display = 'block';
                    return;
                }

                data.forEach((item) => {
                    // 客户端过滤状态
                    if (!isAdmin && item.status && item.status !== 'active') return;

                    const date = item.created_at ? new Date(item.created_at).toLocaleString() : "最近分享 / Recently shared";
                    const likes = item.likes || 0; // 获取点赞数
                    const isLiked = likedDrawings.includes(item.id.toString());
                    
                    const card = document.createElement('div');
                    card.className = 'drawing-card';
                    card.innerHTML = `
                        <img src="${item.image_data}" alt="Drawing">
                        <div class="like-container ${isLiked ? 'liked' : ''}" onclick="window.likeDrawing('${item.id}', this)">
                            <span class="like-icon">${isLiked ? '❤' : '❤'}</span>
                            <span class="like-count">${likes}</span>
                        </div>
                        <div class="drawing-info">
                            <span>分享于 / Shared on: ${date}</span>
                            <button class="delete-btn" onclick="window.deleteDrawing('${item.id}')">删除 / Delete</button>
                        </div>
                    `;
                    galleryElement.appendChild(card);
                });
            } catch (error) {
                console.error("Gallery Error:", error);
                loadingElement.innerText = "加载失败。 / Failed to load.";
                errorElement.innerText = "错误详情 / Error: " + error.message;
                errorElement.style.display = 'block';
            }
        }

        // 点赞逻辑实现
        window.likeDrawing = async (docId, btnElement) => {
            // 如果已经点过赞了，直接返回
            if (btnElement.classList.contains('liked')) return;

            const countElement = btnElement.querySelector('.like-count');
            let currentLikes = parseInt(countElement.innerText);
            
            // 立即给用户视觉反馈 (前端先 +1)
            countElement.innerText = currentLikes + 1;
            btnElement.classList.add('liked'); // 立即添加已点赞样式
            
            try {
                // 将该画作 ID 存入 localStorage 的已点赞列表
                const likedDrawings = JSON.parse(localStorage.getItem('likedDrawings') || '[]');
                if (!likedDrawings.includes(docId.toString())) {
                    likedDrawings.push(docId.toString());
                    localStorage.setItem('likedDrawings', JSON.stringify(likedDrawings));
                }

                // 调用数据库接口进行原子级 +1 操作
                const { data, error } = await window.supabaseClient.rpc('increment_likes', { row_id: docId });
                
                if (error) {
                    // 如果 RPC 失败，退而求其次使用常规 update
                    const { error: updateError } = await window.supabaseClient
                        .from('drawings')
                        .update({ likes: currentLikes + 1 })
                        .eq('id', docId);
                    
                    if (updateError) throw updateError;
                }
            } catch (err) {
                console.error("点赞失败:", err);
                // 失败了就把前端状态改回来
                countElement.innerText = currentLikes;
                btnElement.classList.remove('liked');
                
                // 从 localStorage 中移除
                const likedDrawings = JSON.parse(localStorage.getItem('likedDrawings') || '[]');
                const index = likedDrawings.indexOf(docId.toString());
                if (index > -1) {
                    likedDrawings.splice(index, 1);
                    localStorage.setItem('likedDrawings', JSON.stringify(likedDrawings));
                }
            }
        };

        window.deleteDrawing = async (docId) => {
            if (confirm("管理员操作：永久删除此画作？\nADMIN: Permanent delete?")) {
                try {
                    const { error } = await window.supabaseClient
                        .from('drawings')
                        .delete()
                        .eq('id', docId);
                    
                    if (error) throw error;
                    location.reload();
                } catch (e) { alert("删除失败 / Delete failed: " + e.message); }
            }
        };

        loadGallery();
    </script>

    <footer class="watermark">
        <p>生命在于涂鸦</p>
        <p>感谢支持 ykh 的独立项目，更多咨询请在小红书搜索账号：普通艺术人</p>
    </footer>
</body>
</html>
