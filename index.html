<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Drawing Gallery</title>

    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- p5.js 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
  </head>

  <body>
    <!-- 控制按钮区域 -->
    <div id="controls">
        <button id="shareButton">分享到画廊 / Share to Gallery</button>
        <a href="gallery.html" id="galleryLink">进入画廊 / Go to Gallery</a>
    </div>

    <!-- 画布区域 -->
    <main id="main"></main>

    <!-- Firebase SDK (模块化 CDN 方式) -->
    <script type="module">
      // 引入 Firebase 必要的函数
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
      import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-storage.js";
      import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

      // 你的 Firebase 配置信息
      const firebaseConfig = {
        apiKey: "AIzaSyAXoCirYLEY-hR-5NGzwFGas7FYN_6g4e8",
        authDomain: "ojbkdrawingtool.firebaseapp.com",
        projectId: "ojbkdrawingtool",
        storageBucket: "ojbkdrawingtool.firebasestorage.app",
        messagingSenderId: "629287348964",
        appId: "1:629287348964:web:97e9c481c0b26a0eecdaf1",
        measurementId: "G-XR62TPE8EK"
      };

      // 初始化 Firebase
      const app = initializeApp(firebaseConfig);
      const storage = getStorage(app);
      const db = getFirestore(app);

      // 将这些对象暴露给全局，以便 sketch.js 能够访问
      window.firebaseStorage = storage;
      window.firebaseDB = db;
      window.firebaseRefs = { ref, uploadString, getDownloadURL, collection, addDoc, serverTimestamp };

      console.log("Firebase initialized successfully!");
    </script>

    <!-- 我们的画板脚本 -->
    <script src="sketch.js"></script>
  </body>
</html>
